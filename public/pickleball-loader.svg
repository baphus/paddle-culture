<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="240" height="220" role="img" aria-label="Loading" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Loading…</title>
  <defs>
    <!-- Neon ball body -->
    <radialGradient id="ballGrad" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#d9ff9a"/>
      <stop offset="35%" stop-color="#7dff2e"/>
      <stop offset="75%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#1fc400"/>
    </radialGradient>

    <!-- Hole shading -->
    <radialGradient id="holeGrad" cx="62%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0a2a00"/>
      <stop offset="100%" stop-color="#127a00"/>
    </radialGradient>

    <!-- Neon glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <clipPath id="ballClip">
      <circle cx="0" cy="0" r="50"/>
    </clipPath>
  </defs>

  <!-- Ground shadow (shrinks and fades as the ball rises) -->
  <ellipse cx="120" cy="178" rx="38" ry="7" fill="#39ff14" opacity="0.35" filter="url(#soft)">
    <animate attributeName="rx" values="38;22;38" keyTimes="0;0.5;1" dur="1.2s" repeatCount="indefinite"
             calcMode="spline" keySplines="0.215 0.61 0.355 1;0.55 0.055 0.675 0.19"/>
    <animate attributeName="opacity" values="0.45;0.15;0.45" keyTimes="0;0.5;1" dur="1.2s" repeatCount="indefinite"
             calcMode="spline" keySplines="0.215 0.61 0.355 1;0.55 0.055 0.675 0.19"/>
  </ellipse>

  <!-- Bouncing ball -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="120 120; 120 62; 120 120" keyTimes="0;0.5;1" dur="1.2s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.215 0.61 0.355 1;0.55 0.055 0.675 0.19"/>

    <!-- Outer glow halo -->
    <circle r="52" fill="#39ff14" opacity="0.5" filter="url(#glow)">
      <animate attributeName="opacity" values="0.35;0.7;0.35" dur="1.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Ball body -->
    <circle r="50" fill="url(#ballGrad)"/>

    <!-- Spinning hole pattern, clipped to the ball -->
    <g clip-path="url(#ballClip)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>

        <!-- Center hole -->
        <circle r="8.5" fill="url(#holeGrad)"/>

        <!-- Inner ring: 6 holes -->
        <g fill="url(#holeGrad)">
          <circle cx="28"  cy="0"     r="6.5"/>
          <circle cx="14"  cy="24.2"  r="6.5"/>
          <circle cx="-14" cy="24.2"  r="6.5"/>
          <circle cx="-28" cy="0"     r="6.5"/>
          <circle cx="-14" cy="-24.2" r="6.5"/>
          <circle cx="14"  cy="-24.2" r="6.5"/>
        </g>

        <!-- Outer ring: 12 foreshortened holes near the edge -->
        <g fill="url(#holeGrad)">
          <ellipse cx="46" cy="0" rx="3.2" ry="6" transform="rotate(0)"/>
          <ellipse cx="46" cy="0" rx="3.2" ry="6" transform="rotate(30)"/>
          <ellipse cx="46" cy="0" rx="3.2" ry="6" transform="rotate(60)"/>
          <ellipse cx="46" cy="0" rx="3.2" ry="6" transform="rotate(90)"/>
          <ellipse cx="46" cy="0" rx="3.2" ry="6" transform="rotate(120)"/>
          <ellipse cx="46" cy="0" rx="3.2" ry="6" transform="rotate(150)"/>
          <ellipse cx="46" cy="0" rx="3.2" ry="6" transform="rotate(180)"/>
          <ellipse cx="46" cy="0" rx="3.2" ry="6" transform="rotate(210)"/>
          <ellipse cx="46" cy="0" rx="3.2" ry="6" transform="rotate(240)"/>
          <ellipse cx="46" cy="0" rx="3.2" ry="6" transform="rotate(270)"/>
          <ellipse cx="46" cy="0" rx="3.2" ry="6" transform="rotate(300)"/>
          <ellipse cx="46" cy="0" rx="3.2" ry="6" transform="rotate(330)"/>
        </g>
      </g>
    </g>

    <!-- Specular highlight (stays fixed while the pattern spins) -->
    <ellipse cx="-17" cy="-22" rx="14" ry="8" transform="rotate(-35 -17 -22)" fill="#ffffff" opacity="0.35" filter="url(#soft)"/>

    <!-- Rim light -->
    <circle r="50" fill="none" stroke="#b6ff7a" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>
